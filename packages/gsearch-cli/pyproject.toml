[project]
name = "gsearch-cli"
version = "0.1.0"
description = "Command-line interface for gsearch-core."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["gsearch-core==0.1.0"]

[project.scripts]
gsearch = "gsearch_cli.main:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsearch_cli"]
