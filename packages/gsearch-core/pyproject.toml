[project]
name = "gsearch-core"
version = "0.1.0"
description = "Search orchestration: fetch backends, identities, pacing and block handling over gsearch-parse."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["gsearch-parse==0.1.0"]

[project.optional-dependencies]
# Live search. Camoufox is MPL-2.0: installed from PyPI on request, never vendored.
live = ["camoufox[geoip]==0.5.6", "curl_cffi>=0.16,<0.17"]  # the versions the tests run against

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsearch_core"]
