[project]
name = "gsearch-mcp"
version = "0.1.0"
description = "MCP server (stdio) exposing Google search results to AI agents via gsearch-core."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["gsearch-core==0.1.0", "mcp>=2.3,<3"]

[project.scripts]
gsearch-mcp = "gsearch_mcp.server:main"

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsearch_mcp"]
