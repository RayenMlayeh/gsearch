[project]
name = "gsearch-parse"
version = "0.1.0"
description = "Network-free parsing and page classification for Google search result pages."
license = "MIT"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.9,<3", "selectolax>=1.0,<2"]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/gsearch_parse"]
