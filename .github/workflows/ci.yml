name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    # Offline only: CI never contacts Google or a proxy.
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check packages tests tools examples
          ruff format --check packages tests tools examples
      - name: Type check
        run: mypy
      - name: Tests
        # The Camoufox browser binary is not downloaded in CI, so the tests that launch it are skipped.
        # Locally, after `python -m camoufox fetch`, run plain `pytest` to include them.
        env:
          GSEARCH_SKIP_BROWSER: "1"
        run: pytest
