[project]
name = "gsearch-workspace"
version = "0.0.0"
requires-python = ">=3.12"
description = "Workspace root (not published)."

[tool.uv.workspace]
members = ["packages/*"]

[tool.uv.sources]
gsearch-parse = { workspace = true }
gsearch-core = { workspace = true }
gsearch-cli = { workspace = true }
gsearch-mcp = { workspace = true }

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gsearch_core".msg = "gsearch-parse must not import gsearch-core (tier 1 is network-free)."

[tool.ruff.lint.per-file-ignores]
"packages/gsearch-core/**" = ["TID251"]
"packages/gsearch-cli/**" = ["TID251"]
"packages/gsearch-mcp/**" = ["TID251"]
"tests/**" = ["TID251", "PT018"]  # compound asserts keep fixture expectations readable
"tools/**" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["gsearch_parse", "gsearch_core", "gsearch_cli", "gsearch_mcp"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
