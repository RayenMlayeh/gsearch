[project]
name = "gsearch-agent"
version = "0.1.0"
description = "Real Google Search for AI agents, over MCP: real URLs, AI Overview and People also ask as typed JSON."
readme = "docs/PYPI.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Rayen Mlayeh" }]
keywords = ["mcp", "mcp-server", "google-search", "serp", "ai-agents", "llm", "web-search", "camoufox"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP :: Indexing/Search",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Typing :: Typed",
]
# Camoufox (MPL-2.0) is installed from PyPI, never vendored. Pinned to the versions the tests run against.
dependencies = [
  "pydantic>=2.9,<3",
  "selectolax>=1.0,<2",
  "mcp>=2.3,<3",
  "camoufox[geoip]==0.5.6",
  "curl_cffi>=0.16,<0.17",
]

[project.optional-dependencies]
dev = ["pytest", "anyio", "mypy", "ruff"]

[project.scripts]
gsearch = "gsearch_cli.main:main"
gsearch-mcp = "gsearch_mcp.server:main"
gsearch-agent = "gsearch_mcp.server:main"  # so `uvx gsearch-agent` starts the MCP server

[project.urls]
Homepage = "https://github.com/RayenMlayeh/gsearch"
Source = "https://github.com/RayenMlayeh/gsearch"
Issues = "https://github.com/RayenMlayeh/gsearch/issues"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

# One distribution, four import packages. gsearch_parse stays network-free (enforced by ruff below).
[tool.hatch.build.targets.wheel]
packages = [
  "packages/gsearch-parse/src/gsearch_parse",
  "packages/gsearch-core/src/gsearch_core",
  "packages/gsearch-cli/src/gsearch_cli",
  "packages/gsearch-mcp/src/gsearch_mcp",
]

[tool.hatch.build.targets.sdist]
include = ["packages/*/src", "docs/PYPI.md", "LICENSE", "server.json"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PT", "TID"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"gsearch_core".msg = "gsearch-parse must not import gsearch-core (tier 1 is network-free)."

[tool.ruff.lint.per-file-ignores]
"packages/gsearch-core/**" = ["TID251"]
"packages/gsearch-cli/**" = ["TID251"]
"packages/gsearch-mcp/**" = ["TID251"]
"tests/**" = ["TID251", "PT018"]  # compound asserts keep fixture expectations readable
"tools/**" = ["TID251"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["gsearch_parse", "gsearch_core", "gsearch_cli", "gsearch_mcp"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
