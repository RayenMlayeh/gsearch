<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="t d">
  <title id="t">What your agent gets</title>
  <desc id="d">Each part of a Google results page and the JSON field it becomes: AI Overview, organic results with real URLs, People also ask, related searches and pagination.</desc>
  <defs>
    <style>
      .f { font-family: "Google Sans", "Product Sans", Roboto, "Segoe UI", Arial, sans-serif; }
      .m { font-family: "Roboto Mono", "Cascadia Code", Consolas, monospace; }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="699" rx="20" fill="#ffffff" stroke="#dadce0"/>
  <text x="40" y="52" class="f" font-size="26" font-weight="500" fill="#202124">What your agent gets</text>
  <text x="40" y="80" class="f" font-size="16" fill="#5f6368">Each part of the results page becomes a typed JSON field. Colours match.</text>

  <!-- ===== left: results page ===== -->
  <g transform="translate(40 104)">
    <rect width="540" height="568" rx="14" fill="#ffffff" stroke="#dadce0"/>
    <rect width="540" height="56" rx="14" fill="#f8f9fa"/>
    <rect y="42" width="540" height="14" fill="#f8f9fa"/>
    <rect x="20" y="12" width="500" height="32" rx="16" fill="#ffffff" stroke="#dfe1e5"/>
    <text x="40" y="33" class="f" font-size="14" fill="#202124">what is asyncio in python</text>

    <!-- AI overview -->
    <rect x="20" y="72" width="500" height="92" rx="12" fill="#fef7e0" stroke="#FBBC05" stroke-width="1.5"/>
    <path d="M43 83 Q44 90 51 91 Q44 92 43 99 Q42 92 35 91 Q42 90 43 83 Z" fill="#F29900"/>
    <text x="56" y="96" class="f" font-size="14" font-weight="500" fill="#b06000">AI Overview</text>
    <rect x="36" y="108" width="440" height="8" rx="4" fill="#f9dfa0"/>
    <rect x="36" y="124" width="400" height="8" rx="4" fill="#f9dfa0"/>
    <rect x="36" y="140" width="300" height="8" rx="4" fill="#f9dfa0"/>

    <!-- organic -->
    <g transform="translate(20 180)">
      <rect width="500" height="152" rx="12" fill="#ffffff" stroke="#4285F4" stroke-width="1.5"/>
      <text x="16" y="26" class="f" font-size="12" fill="#3c4043">docs.python.org › library › asyncio</text>
      <text x="16" y="48" class="f" font-size="17" fill="#1a0dab">asyncio — Asynchronous I/O</text>
      <rect x="16" y="58" width="440" height="7" rx="3.5" fill="#e8eaed"/>
      <rect x="16" y="70" width="360" height="7" rx="3.5" fill="#e8eaed"/>
      <text x="16" y="102" class="f" font-size="12" fill="#3c4043">realpython.com › async-io-python</text>
      <text x="16" y="124" class="f" font-size="17" fill="#1a0dab">Python's asyncio: A Hands-On Walkthrough</text>
      <rect x="16" y="134" width="420" height="7" rx="3.5" fill="#e8eaed"/>
    </g>

    <!-- people also ask -->
    <g transform="translate(20 348)">
      <rect width="500" height="100" rx="12" fill="#ffffff" stroke="#EA4335" stroke-width="1.5"/>
      <text x="16" y="26" class="f" font-size="15" font-weight="500" fill="#202124">People also ask</text>
      <text x="16" y="56" class="f" font-size="14" fill="#202124">What is the use of asyncio in Python?</text>
      <path d="M470 50 l6 6 l6 -6" fill="none" stroke="#5f6368" stroke-width="2"/>
      <line x1="16" y1="68" x2="484" y2="68" stroke="#e8eaed"/>
      <text x="16" y="88" class="f" font-size="14" fill="#202124">Is asyncio better than threading?</text>
      <path d="M470 82 l6 6 l6 -6" fill="none" stroke="#5f6368" stroke-width="2"/>
    </g>

    <!-- related -->
    <g transform="translate(20 462)">
      <rect width="500" height="50" rx="12" fill="#ffffff" stroke="#34A853" stroke-width="1.5"/>
      <rect x="14" y="12" width="150" height="26" rx="13" fill="#f1f3f4"/>
      <text x="89" y="30" class="f" font-size="12.5" text-anchor="middle" fill="#202124">Python asyncio examples</text>
      <rect x="174" y="12" width="140" height="26" rx="13" fill="#f1f3f4"/>
      <text x="244" y="30" class="f" font-size="12.5" text-anchor="middle" fill="#202124">Python async/await</text>
      <rect x="324" y="12" width="120" height="26" rx="13" fill="#f1f3f4"/>
      <text x="384" y="30" class="f" font-size="12.5" text-anchor="middle" fill="#202124">Asyncio gather</text>
    </g>

    <!-- pagination -->
    <g transform="translate(20 524)" class="f">
      <rect width="500" height="32" rx="12" fill="#ffffff" stroke="#4285F4" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text x="170" y="22" font-size="15" fill="#202124" font-weight="500">1</text>
      <text x="200" y="22" font-size="15" fill="#1a0dab">2</text>
      <text x="230" y="22" font-size="15" fill="#1a0dab">3</text>
      <text x="260" y="22" font-size="15" fill="#1a0dab">4</text>
      <text x="300" y="22" font-size="15" fill="#1a0dab">Next ›</text>
    </g>
  </g>

  <!-- ===== connectors ===== -->
  <g fill="none" stroke-width="2">
    <path d="M560 222 C 600 222, 600 173, 640 173" stroke="#FBBC05"/>
    <path d="M560 360 C 600 360, 600 310, 640 310" stroke="#4285F4"/>
    <path d="M560 502 C 600 502, 600 436, 640 436" stroke="#EA4335"/>
    <path d="M560 591 C 600 591, 600 498, 640 498" stroke="#34A853"/>
    <path d="M560 644 C 600 644, 600 550, 640 550" stroke="#4285F4" stroke-dasharray="5 4"/>
  </g>
  <g>
    <circle cx="560" cy="222" r="5" fill="#FBBC05"/>
    <circle cx="560" cy="360" r="5" fill="#4285F4"/>
    <circle cx="560" cy="502" r="5" fill="#EA4335"/>
    <circle cx="560" cy="591" r="5" fill="#34A853"/>
    <circle cx="560" cy="644" r="5" fill="#4285F4"/>
  </g>

  <!-- ===== right: JSON ===== -->
  <g transform="translate(640 104)">
    <rect width="520" height="568" rx="14" fill="#f8f9fa" stroke="#dadce0"/>
    <g class="m" font-size="14">
      <text x="20" y="32" fill="#5f6368">{</text>

      <rect x="12" y="40" width="496" height="58" rx="8" fill="#fef7e0"/>
      <text x="32" y="62"><tspan fill="#b06000" font-weight="bold">"ai_overview"</tspan><tspan fill="#5f6368">: {</tspan></text>
      <text x="52" y="86"><tspan fill="#1a73e8">"text"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#188038">"asyncio is a built-in…"</tspan><tspan fill="#5f6368">, … },</tspan></text>

      <rect x="12" y="108" width="496" height="196" rx="8" fill="#e8f0fe"/>
      <text x="32" y="130"><tspan fill="#1967d2" font-weight="bold">"organic"</tspan><tspan fill="#5f6368">: [{</tspan></text>
      <text x="52" y="154"><tspan fill="#1a73e8">"position"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#c5221f">1</tspan><tspan fill="#5f6368">,</tspan></text>
      <text x="52" y="178"><tspan fill="#1a73e8">"title"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#188038">"asyncio — Asynchronous I/O"</tspan><tspan fill="#5f6368">,</tspan></text>
      <text x="52" y="202"><tspan fill="#1a73e8">"url"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#188038">"https://docs.python.org/3/</tspan></text>
      <text x="100" y="222" fill="#188038">library/asyncio.html"<tspan fill="#5f6368">,</tspan></text>
      <text x="52" y="246"><tspan fill="#1a73e8">"domain"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#188038">"docs.python.org"</tspan><tspan fill="#5f6368">,</tspan></text>
      <text x="52" y="270"><tspan fill="#1a73e8">"snippet"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#188038">"asyncio is a library to…"</tspan></text>
      <text x="32" y="294" fill="#5f6368">}, … ],</text>

      <rect x="12" y="314" width="496" height="40" rx="8" fill="#fce8e6"/>
      <text x="32" y="339"><tspan fill="#c5221f" font-weight="bold">"people_also_ask"</tspan><tspan fill="#5f6368">: [{ </tspan><tspan fill="#1a73e8">"question"</tspan><tspan fill="#5f6368">: … }],</tspan></text>

      <rect x="12" y="376" width="496" height="40" rx="8" fill="#e6f4ea"/>
      <text x="32" y="401"><tspan fill="#137333" font-weight="bold">"related_searches"</tspan><tspan fill="#5f6368">: [</tspan><tspan fill="#188038">"Python asyncio…"</tspan><tspan fill="#5f6368">, …],</tspan></text>

      <rect x="12" y="428" width="496" height="40" rx="8" fill="#e8f0fe"/>
      <text x="32" y="453"><tspan fill="#1967d2" font-weight="bold">"pagination"</tspan><tspan fill="#5f6368">: { </tspan><tspan fill="#1a73e8">"current"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#c5221f">1</tspan><tspan fill="#5f6368">, </tspan><tspan fill="#1a73e8">"next_page"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#c5221f">2</tspan><tspan fill="#5f6368"> },</tspan></text>

      <text x="32" y="500"><tspan fill="#1a73e8">"ads"</tspan><tspan fill="#5f6368">: [ … ],  </tspan><tspan fill="#1a73e8">"meta"</tspan><tspan fill="#5f6368">: {</tspan></text>
      <text x="52" y="524"><tspan fill="#1a73e8">"untrusted_content"</tspan><tspan fill="#5f6368">: </tspan><tspan fill="#c5221f">true</tspan><tspan fill="#5f6368">, … }</tspan></text>
      <text x="20" y="552" fill="#5f6368">}</text>
    </g>
  </g>
</svg>
